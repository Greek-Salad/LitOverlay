<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#202124" id="theme-color-meta">
    <title>Читалка - LitOverlay</title>
    <link rel="icon" href="./favicon.ico" type="image/x-icon">
    <link rel="manifest" href="./manifest.json">
    <script>
      (function () {
        var standardThemes = {
          light: { bg: "#f7f8f4", text: "#242424" },
          dark: { bg: "#202124", text: "#e8eaed" }
        };
        var isValidHex = function (value) {
          return /^#([0-9a-f]{3}|[0-9a-f]{6})$/i.test(String(value || "").trim());
        };
        try {
          var preset = JSON.parse(localStorage.getItem("themePreset"));
          var colors = JSON.parse(localStorage.getItem("themeColors"));
          var safePreset = ["light", "dark", "custom"].indexOf(preset) >= 0 ? preset : "dark";
          var safeColors = safePreset === "custom"
            ? {
                bg: isValidHex(colors && colors.bg) ? colors.bg : standardThemes.dark.bg,
                text: isValidHex(colors && colors.text) ? colors.text : standardThemes.dark.text
              }
            : standardThemes[safePreset];
          var root = document.documentElement;
          root.setAttribute("data-theme", safePreset);
          root.style.setProperty("--bg-color", safeColors.bg);
          root.style.setProperty("--text-color", safeColors.text);
          document.getElementById("theme-color-meta")?.setAttribute("content", safeColors.bg);
        } catch (error) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
    <link rel="stylesheet" href="./css/normalize.css">
    <link rel="stylesheet" href="./css/fonts.css">
    <link rel="stylesheet" href="./css/app.css">
  </head>
  <body class="reader-page">
    <lo-reader-app></lo-reader-app>
    <script type="module" src="./js/reader.js"></script>
  </body>
</html>
